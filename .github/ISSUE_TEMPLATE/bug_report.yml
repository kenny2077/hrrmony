name: Bug report
description: Something broke or sounds wrong
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. hrrmony cover song.mp3 --full
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hrrmony doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: [CLI, Web app, Python API, Docker, Installation]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, Windows (WSL), Windows, macOS (Apple Silicon), macOS (Intel)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (run with `-v`)
      render: text
