[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "villager-sound"
dynamic = ["version"]
description = "Turn any song into a Minecraft villager cover: vocal separation + RVC villager voice, locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/villager_sound/_vendor/infer_rvc_python/LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "Kaiyi Guo" }]
keywords = ["minecraft", "villager", "voice-conversion", "rvc", "music", "cover", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
# Light core: enough to import the package, run the CLI parser, the hook finder and the mixer.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "librosa>=0.10",
  "soundfile>=0.12",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
# The ML stack. `transformers` is capped because the RVC HuBERT loader uses HubertModel APIs
# removed in transformers 5; `setuptools<81` keeps pyworld's pkg_resources import working.
ml = [
  "torch>=2.1",
  "torchaudio>=2.1",
  "transformers>=4.40,<4.50",
  "faiss-cpu>=1.7.4",
  "praat-parselmouth>=0.4.2",
  "pyworld>=0.3.4",
  "soxr>=0.3",
  "ffmpeg-python>=0.2",
  "tqdm>=4.60",
  "setuptools<81",
]
cpu = ["villager-sound[ml]", "audio-separator[cpu]>=0.30"]
gpu = ["villager-sound[ml]", "audio-separator[gpu]>=0.30"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
all = ["villager-sound[gpu,web]"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "villager-sound[web]"]

[project.scripts]
villager-sound = "villager_sound.cli:main"

[project.urls]
Homepage = "https://github.com/kenny2077/villager-sound"
Issues = "https://github.com/kenny2077/villager-sound/issues"
Changelog = "https://github.com/kenny2077/villager-sound/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/villager_sound/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/villager_sound"]

[tool.hatch.build.targets.sdist]
exclude = ["/research", "/.github", "/assets/*.mp3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: downloads models and runs the full pipeline (opt-in: -m slow)",
  "gpu: needs a CUDA GPU",
]
addopts = "-m 'not slow and not gpu'"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/villager_sound/_vendor", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
