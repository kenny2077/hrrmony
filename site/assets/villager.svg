<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges">
  <!-- robe -->
  <rect x="2" y="8" width="8" height="4" fill="#6b4a33"/>
  <rect x="2" y="9" width="8" height="2" fill="#7f5a3f"/>
  <rect x="2" y="9" width="8" height="1" fill="#5c3f2b"/>
  <!-- head -->
  <rect x="2" y="0" width="8" height="8" fill="#bd8a6d"/>
  <rect x="2" y="0" width="8" height="2" fill="#5e3d27"/>
  <rect x="2" y="2" width="1" height="6" fill="#a9765b"/>
  <rect x="9" y="2" width="1" height="6" fill="#a9765b"/>
  <!-- brow -->
  <rect x="3" y="3" width="6" height="1" fill="#4a2e1f"/>
  <!-- eyes: white outside, green inside -->
  <rect x="3" y="4" width="1" height="1" fill="#f2f2ec"/><rect x="4" y="4" width="1" height="1" fill="#2f9e4f"/>
  <rect x="7" y="4" width="1" height="1" fill="#2f9e4f"/><rect x="8" y="4" width="1" height="1" fill="#f2f2ec"/>
  <!-- the nose -->
  <rect x="5" y="4" width="2" height="6" fill="#a46c52"/>
  <rect x="5" y="4" width="1" height="5" fill="#b57c60"/>
  <rect x="5" y="9" width="2" height="1" fill="#8c5a43"/>
</svg>
